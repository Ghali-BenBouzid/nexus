name: CI

on:
  push:
    branches: [main]
  # Every pull request, including one stacked on another feature branch.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in well under a minute. Anything approaching this is a
    # hang, not slow tests, and a hang should fail the run rather than sit on a
    # runner for the six hours GitHub allows by default.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install python
        run: uv python install 3.13.13

      - name: install dependencies
        run: uv sync --all-groups

      - name: Run ruff
        run: uv run ruff check .
      
      - name: Run pytest
        env:
          # Tests use an in-memory SQLite engine (see tests/conftest.py); the app
          # engine is never connected, so this just needs to be a valid async URL.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
        run: uv run pytest