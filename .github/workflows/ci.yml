name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install python
        run: uv python install 3.13.13

      - name: install dependencies
        run: uv sync --all-groups

      - name: Run ruff
        run: uv run ruff check .
      
      - name: Run pytest
        run: uv run pytest