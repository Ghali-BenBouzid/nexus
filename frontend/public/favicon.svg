<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 11 41 41" fill="none">
  <!-- Monochrome mark, no tile. Adapts to the browser/OS theme: ink on light
       chrome, off-white on dark. Tight viewBox so the mark fills the favicon. -->
  <style>
    .m { stroke: #1c1714; }
    .f { fill: #1c1714; }
    @media (prefers-color-scheme: dark) {
      .m { stroke: #f4f1f8; }
      .f { fill: #f4f1f8; }
    }
  </style>
  <g class="m" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 48 V 16" />
    <path d="M18 16 L 46 48" />
    <path d="M46 48 V 16" />
  </g>
  <g class="f">
    <circle cx="18" cy="16" r="3.6" />
    <circle cx="18" cy="48" r="3.6" />
    <circle cx="46" cy="16" r="3.6" />
    <circle cx="46" cy="48" r="3.6" />
  </g>
</svg>
