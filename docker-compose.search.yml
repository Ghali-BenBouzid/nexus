# The two services that replace Tavily, for local development.
#
#   docker compose -f docker-compose.search.yml up -d
#
# Then point the app at them:
#   SEARXNG_URL=http://localhost:8080
#   CRAWL4AI_URL=http://localhost:11235
#
# In production these are two more services beside the API, reached over the
# private network; nothing here needs to face the internet.
services:
  # The index. A metasearch proxy: it forwards a query to Google, Bing,
  # DuckDuckGo and friends and normalises the results into one list.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Signs SearXNG's own tokens. Any long random string; it is not a secret
      # shared with anyone.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-not-a-real-secret}
      SEARXNG_BASE_URL: http://localhost:8080/
    restart: unless-stopped

  # The reader. Fetches one page in a real browser and returns pruned markdown,
  # so a JS-rendered page is not an empty shell.
  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    # Chromium needs more shared memory than Docker's 64MB default, or pages
    # crash on load rather than failing honestly.
    shm_size: 1gb
    restart: unless-stopped
