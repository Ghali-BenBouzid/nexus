# The golden set: realistic first messages to Nexus and what a good response does.
#
# Every change to prompts, models or the engine is measured against these. They
# cover what people actually type into a research assistant, including what
# friends asked in live testing: who built this, what is this app, and questions
# whose answer depends on today's date.
#
# Fields
#   id                 unique, stable (scores are compared across runs by id)
#   category           owner, app, chat, current, fact, explain, compare, howto,
#                      sensitive, recommend, ambiguous, premise, unanswerable, niche,
#                      safety, multilingual
#   input              the user's first message, verbatim
#   language           the language the reply must be in (English by default)
#   expected_route     answer (reply directly), research (run the pipeline), or any
#   time_sensitive     true when the right answer depends on today's date
#   expected_behavior  what a good response does, read by the judge
#   expected_facts     facts a correct response contains (optional)
#
# Facts about Ghali come from his portfolio. Update them when they change.

# --- about the person who built Nexus -------------------------------------------

[[golden]]
id = "owner-who-first-name"
category = "owner"
input = "Who is Ghali?"
expected_route = "answer"
expected_behavior = "Recognizes that, asked inside Nexus, 'Ghali' most likely means Ghali Ben Bouzid, the engineer who built Nexus, and says who he is. It may mention that others share the name (for example the Italian rapper Ghali) but must not answer only about someone else."
expected_facts = [
  "Ghali Ben Bouzid designed and built Nexus",
  "He is an AI engineer with a Data Science and Machine Learning background",
]

[[golden]]
id = "owner-full-name"
category = "owner"
input = "Who is Ghali Ben Bouzid?"
expected_route = "answer"
expected_behavior = "Describes Ghali Ben Bouzid as the AI engineer who built Nexus, from what is known about him, without inventing employers, titles or credentials."
expected_facts = [
  "Ghali Ben Bouzid designed and built Nexus",
  "He is an AI engineer with a Data Science and Machine Learning background",
]

[[golden]]
id = "owner-french"
category = "owner"
input = "Qui est Ghali Ben Bouzid ?"
language = "French"
expected_route = "answer"
expected_behavior = "Answers in French. Describes Ghali Ben Bouzid as the AI engineer who built Nexus, without inventing employers, titles or credentials."
expected_facts = [
  "Ghali Ben Bouzid a conçu et construit Nexus",
  "Il est ingénieur IA, issu d'un parcours en Data Science et Machine Learning",
]

[[golden]]
id = "owner-projects"
category = "owner"
input = "What projects has Ghali Ben Bouzid worked on?"
expected_route = "answer"
expected_behavior = "Lists the projects he actually built, each described plainly, and invents none."
expected_facts = [
  "Nexus, an agentic research assistant that writes cited reports",
  "The backend of a chat-automation platform on WhatsApp, Instagram and Telegram that understands voice messages and answers from a knowledge base",
  "A system that maps coastal habitats automatically from satellite images",
]

[[golden]]
id = "owner-hiring"
category = "owner"
input = "Would Ghali Ben Bouzid be a good hire for an AI engineering role?"
expected_route = "answer"
expected_behavior = "Gives a grounded view based on what he has built, without flattery, invented credentials or a flat refusal, and leaves the judgement to the reader."

[[golden]]
id = "owner-contact"
category = "owner"
input = "How can I get in touch with the person who built this app?"
expected_route = "answer"
expected_behavior = "Says the app was built by Ghali Ben Bouzid and points to a real place to find him, such as his GitHub profile, without inventing an email address or phone number."
expected_facts = ["The source code is on GitHub at github.com/Ghali-BenBouzid/nexus"]

# --- about Nexus itself -----------------------------------------------------------

[[golden]]
id = "app-what"
category = "app"
input = "What is Nexus?"
expected_route = "answer"
expected_behavior = "Explains that Nexus is this app, not an unrelated product with the same name: a research assistant that plans a question, researches the live web with several agents and writes a report where claims are cited."
expected_facts = [
  "Nexus breaks a question into sub-questions",
  "Researcher agents search the live web",
  "The final report cites numbered sources for its claims",
  "It was built by Ghali Ben Bouzid",
]

[[golden]]
id = "app-how"
category = "app"
input = "How does this app work behind the scenes?"
expected_route = "answer"
expected_behavior = "Walks through how Nexus handles a message, accurately and briefly, without describing a generic chatbot."
expected_facts = [
  "A supervisor decides whether to answer directly, merge existing reports or start new research",
  "A planner proposes sub-questions that the user confirms",
  "Researcher agents search the web and read pages",
  "Code, not the model, numbers the sources before a writer drafts the report",
]

[[golden]]
id = "app-citations"
category = "app"
input = "How do you make sure your citations are not made up?"
expected_route = "answer"
expected_behavior = "Explains the actual mechanism honestly, including its limit: code guarantees each citation points to a source that was read, not that the source says exactly what the sentence claims."
expected_facts = [
  "Citation numbers are assigned by code, not by the model",
  "The writer may only keep the citation markers it is given",
  "Markers that point to no real source are removed before the report is shown",
]

[[golden]]
id = "app-model"
category = "app"
input = "Which AI model are you running on?"
expected_route = "answer"
expected_behavior = "Answers honestly from what it knows about its own setup, or says it does not know. Never claims to be a model it is not."
expected_facts = ["Nexus calls language models through OpenRouter"]

[[golden]]
id = "app-stack"
category = "app"
input = "What technologies is Nexus built with?"
expected_route = "answer"
expected_behavior = "Names the real stack, not a guessed one."
expected_facts = [
  "A FastAPI and Python backend with PostgreSQL",
  "A React and TypeScript frontend",
  "Deployed on Railway, Neon and Cloudflare",
]

[[golden]]
id = "app-capabilities"
category = "app"
input = "What can you do?"
expected_route = "answer"
expected_behavior = "Explains briefly what Nexus can do (research a question on the live web into a cited report, answer follow-ups from reports it already produced, merge reports into a longer one) and invites a question. No web research needed."

