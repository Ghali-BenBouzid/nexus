[project]
name = "nexus"
version = "0.1.0"
description = "Agentic research platform that plans a question, researches the web and writes a cited report"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "arq>=0.28",
    "asyncpg>=0.31.0",
    "boto3>=1.43.97",
    "fastapi>=0.136.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langdetect>=1.0.9",
    "langgraph>=1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.8.16",
    "onnxruntime>=1.30.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.14.0",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.2",
    "sqlalchemy>=2.0.49",
    "tavily-python>=0.7.25",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "deepeval>=4.2.3",
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
evals = []

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# deepeval's pytest plugin imports deepeval at startup, which loads ./.env into
# os.environ and leaks real secrets into every test. The evals have their own
# CLI (python -m app.evals) and never use the plugin.
addopts = "-p no:deepeval"
