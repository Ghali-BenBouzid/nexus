# Only what differs from SearXNG's own defaults: use_default_settings inherits
# the rest, so this file stays readable and does not drift as SearXNG changes.
use_default_settings: true

server:
  # Overridden by SEARXNG_SECRET at run time; this placeholder only exists so a
  # bare `docker compose up` works without a .env.
  secret_key: "change-me-in-the-environment"
  limiter: false  # no bot filtering: the only client is our own worker
  image_proxy: false

search:
  # The whole point of this instance. JSON output is off in SearXNG's defaults,
  # which is why public instances answer our API calls with 403 and why this
  # has to be self-hosted rather than pointed at someone else's.
  formats:
    - html
    - json
  # How long an engine sits out after refusing us. SearXNG's defaults bench a
  # CAPTCHA for a day and a rate limit for an hour, which a deep run (dozens of
  # searches at once, all from one IP) trips in minutes and then pays for all
  # day. Shorter, so an engine comes back while there is still work for it.
  suspended_times:
    SearxEngineAccessDenied: 900
    SearxEngineCaptcha: 900
    SearxEngineTooManyRequests: 300

# More engines to spread the load: every one of them rate limits a single IP,
# and with only DuckDuckGo and Brave doing the real work a deep run had both
# refusing within minutes. These are off in SearXNG's defaults, not broken.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
